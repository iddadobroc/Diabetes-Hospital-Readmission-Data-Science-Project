# The ML pipeline of the project (course schema, W9-W10): test the data, train, test
# the model, check the quality gate, keep the model of every run. A tag starting with
# "v" (e.g. v1.0) also publishes that version: GitHub release, Hugging Face model
# repository (same tag) and the Gradio Space, which loads exactly that version.
#
# One-time setup (see README, "Deployment"):
#   - repository secret HF_TOKEN: a Hugging Face token with Write access;
#   - the Space <hf user>/diabetes-readmission-app created by hand (Gradio, Blank,
#     CPU basic); the model repository is created by the first upload.
# Release: git tag v1.0 && git push origin v1.0  (a tag cannot be reused: on a failure,
# fix and push v1.1).

name: ml-pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # only to create the GitHub release on tags

env:
  MODEL_REPO_NAME: diabetes-readmission-model
  SPACE_NAME: diabetes-readmission-app
  MODEL_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('ci-{0}', github.sha) }}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install the pinned dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Get the data (UCI, checked by SHA-256)
        run: python scripts/fetch_data.py

      - name: Test the code and the data
        run: python -m unittest -v tests.test_src tests.test_data

      - name: Train the model
        run: python train.py

      - name: Test the model
        run: python -m unittest -v tests.test_model

      - name: Check the quality gate
        run: python check_quality.py

      - name: Keep the model of this run
        uses: actions/upload-artifact@v7
        with:
          name: model-${{ env.MODEL_VERSION }}
          path: models/

      - name: Publish a GitHub release (tags starting with v only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          models/model.joblib models/metrics.json models/config.json
          --title "Readmission model $GITHUB_REF_NAME"
          --notes-file models/report.md

      - name: Publish the model on Hugging Face (tags starting with v only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub==2.4.0
          HF_USER=$(python -c "from huggingface_hub import whoami; print(whoami()['name'])")
          echo "Publishing as $HF_USER"
          echo "HF_USER=$HF_USER" >> "$GITHUB_ENV"
          cp docs/model_card.md models/README.md
          hf upload "$HF_USER/$MODEL_REPO_NAME" models . --commit-message "Model $GITHUB_REF_NAME"
          hf repos tag create "$HF_USER/$MODEL_REPO_NAME" "$GITHUB_REF_NAME"

      - name: Update the app on Hugging Face (tags starting with v only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "$HF_USER/$MODEL_REPO_NAME" > space/model_repo.txt
          echo "$GITHUB_REF_NAME" > space/model_version.txt
          cp src/features.py src/data_prep.py src/scoring.py src/ibcs.py space/
          mkdir -p space/figures && cp reports/figures/*.png space/figures/
          hf upload "$HF_USER/$SPACE_NAME" space . --repo-type space --commit-message "App for model $GITHUB_REF_NAME"
